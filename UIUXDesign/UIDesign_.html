<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIUX-guide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
        }

        .container {
            width: 100%;
            max-width: 1920px; /* 최대 너비 설정 */
            margin: 0 auto;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-container {
            width: 100%;
            background-color: #faf9fc;
            text-align: center;
            padding: 20px 0;
        }

        .video-container video {
            width: 80%;
            max-width: 800px; /* 동영상 최대 너비 제한 */
            height: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="images/UIDesign_01.jpg" alt="UI Design 1">
    
    <div class="video-container">
        <video src="video/ezgif.com-crop (1).mp4" autoplay controls></video>
    </div>

    <img src="images/UIDesign_02.jpg" alt="UI Design 2">
    <img src="images/UIDesign_03.jpg" alt="UI Design 3">
    <img src="images/UIDesign_04.jpg" alt="UI Design 4">
    <img src="images/UIDesign_05.jpg" alt="UI Design 5">
    <img src="images/UIDesign_06.jpg" alt="UI Design 6">
    <img src="images/UIDesign_07.jpg" alt="UI Design 7">
    <img src="images/UIDesign_08.jpg" alt="UI Design 8">
    <img src="images/UIDesign_09.jpg" alt="UI Design 9">
    <img src="images/UIDesign_10.jpg" alt="UI Design 10">

</div>

</html>
